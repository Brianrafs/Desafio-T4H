[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banco-agil"
version = "0.1.0"
description = "Atendimento bancário conversacional com regras determinísticas"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai[litellm]>=1.0,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "streamlit>=1.57,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/banco_agil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
